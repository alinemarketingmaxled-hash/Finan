<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Max Led Painel Financeiro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23f2a93c'/%3E%3Ctext x='12' y='17' font-size='13' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23241705'%3EML%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b0d12;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #151925;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(145deg, #f2a93c, #c97c1d);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #241705; font-size: 16px; flex: none;
  }
  .brand-name { font-weight: 700; font-size: 16px; }
  .brand-sub { font-size: 12px; color: #8b8fa3; }
  h1 { font-size: 18px; margin: 0 0 6px; font-weight: 700; }
  p.lead { font-size: 13px; color: #b7bad0; margin: 0 0 24px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: #b7bad0; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  input {
    width: 100%; padding: 11px 13px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.12); background: #1b2030; color: #fff;
    font-size: 16px; /* >=16px evita zoom automático do Safari iOS ao focar o campo */
  }
  input:focus { outline: 2px solid #f2a93c; outline-offset: 1px; }
  button {
    width: 100%; padding: 12px; border-radius: 9px; border: none;
    background: #f2a93c; color: #241705; font-weight: 700; font-size: 14px;
    cursor: pointer; margin-top: 6px;
  }
  button:hover { filter: brightness(1.06); }
  .error {
    background: rgba(230,103,103,0.15); color: #e66767;
    border-radius: 8px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 18px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">ML</div>
      <div>
        <div class="brand-name">Max Led</div>
        <div class="brand-sub">Painel Financeiro</div>
      </div>
    </div>
    <h1>Entrar</h1>
    <p class="lead">Acesso restrito — informe seu e-mail e senha.</p>
    <div id="errorBox" class="error" style="display:none;"></div>
    <form method="POST" action="/login">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus required>
      </div>
      <div class="field">
        <label for="pass">Senha</label>
        <input id="pass" name="pass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      </div>
      <button type="submit">Entrar</button>
    </form>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var box = document.getElementById("errorBox");
    if (params.get("blocked")) {
      var minutes = params.get("minutes");
      box.textContent = "Muitas tentativas incorretas. Aguarde " + (minutes || "alguns") + " minuto(s) antes de tentar de novo.";
      box.style.display = "block";
    } else if (params.get("error")) {
      var remaining = params.get("remaining");
      box.textContent = remaining
        ? "E-mail ou senha incorretos. Restam " + remaining + " tentativa(s) antes do bloqueio temporário."
        : "E-mail ou senha incorretos.";
      box.style.display = "block";
    }
  </script>
</body>
</html>
